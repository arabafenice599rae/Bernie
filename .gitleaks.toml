# Configurazione di gitleaks: regole predefinite più i keypair Solana, che gitleaks
# non riconosce da solo (array JSON di 64 byte).
[extend]
useDefault = true

[[rules]]
id = "solana-keypair"
description = "Keypair Solana (array JSON di 64 byte)"
regex = '''\[\s*(?:\d{1,3}\s*,\s*){63}\d{1,3}\s*\]'''
tags = ["key", "solana"]
