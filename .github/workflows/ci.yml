name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      fuzz:
        description: "Moltiplicatore dei casi Python (BERNIE_FUZZ)"
        default: "10"
  schedule:
    - cron: "17 3 * * *" # fuzz lungo notturno

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SOLC_VERSION: "0.8.30+commit.73712a01"
  AGAVE_VERSION: "4.2.2"

jobs:
  secrets:
    name: Segreti (gitleaks, tutta la storia)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - run: ~/go/bin/gitleaks git --config .gitleaks.toml --redact --log-opts="--all" .

  model:
    name: Modello, proprietà, vettori
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Test del modello (fuzz, P1–P7, §8, §9, sync con l'Appendice A)
        env:
          BERNIE_FUZZ: ${{ github.event_name == 'schedule' && '20' || inputs.fuzz || '1' }}
          BERNIE_SEED: ${{ github.event_name == 'schedule' && github.run_id || '1' }}
        run: python -m unittest discover -s tests -v
      - name: Vettori aggiornati
        run: python tools/gen_vectors.py --check
      - name: Keccak di riferimento
        run: python tools/keccak.py

  abi:
    name: Appendice B contro keccak e solc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installa solc
        run: |
          curl -sSfL -o solc "https://binaries.soliditylang.org/linux-amd64/solc-linux-amd64-v${SOLC_VERSION}"
          chmod +x solc
          ./solc --version
      - name: Verifica selettori e topic
        run: SOLC=./solc python tools/abi_check.py

  rust:
    name: Rust (fmt, clippy, state.rs)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: solana
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: solana
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test -p bernie-state --release

  program:
    name: Programma Solana (SBF + Mollusk)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: solana
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: solana
      - name: Installa Agave
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v${AGAVE_VERSION}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - name: Build SBF
        run: cargo build-sbf --manifest-path program/Cargo.toml
      - name: Mollusk (vettori, CPI Guard, CU, transazioni del frontend)
        env:
          RUST_LOG: "off"
        run: cargo test -p bernie-program --release -- --nocapture

  frontend:
    name: Frontend (costruttori di istruzioni)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - name: Transazioni del frontend aggiornate
        run: node emit.mjs --check

  evm:
    name: Contratti EVM (Foundry, vettori 1e18)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: evm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Dipendenze (forge-std da GitHub via HTTPS)
        run: |
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          npm ci
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge build --sizes
      - run: forge test -vv
      - name: Selettori secondo forge
        run: forge inspect IBernie methodIdentifiers && forge inspect IBernieFactory methodIdentifiers

