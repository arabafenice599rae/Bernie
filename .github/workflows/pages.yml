name: Frontend su GitHub Pages

# Pubblica frontend/index.html e frontend/upgrade.html così come sono. Richiede Settings → Pages → Source: GitHub Actions.
on:
  push:
    branches: [main]
    paths: [frontend/index.html, frontend/upgrade.html, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Pubblica frontend
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Solo le pagine
        run: mkdir -p site && cp frontend/index.html frontend/upgrade.html site/ && touch site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
